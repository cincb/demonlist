<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>cudGD - Geometry Dash Demon List</title>
  <style>
    /* ==========================================
       1. CORE STYLES & RESET
       ========================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0f1117;
      color: #e2e8f0;
      padding: 1.5rem;
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Top Header & Section Navigation */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid #334155;
      padding-bottom: 1rem;
    }

    .logo {
      font-size: 1.8rem;
      font-weight: 800;
      color: #8b5cf6;
      letter-spacing: 0.5px;
    }

    .nav-tabs {
      display: flex;
      gap: 0.5rem;
      background: #1e293b;
      padding: 0.3rem;
      border-radius: 10px;
      border: 1px solid #334155;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 0.5rem 1.25rem;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: #8b5cf6;
      color: #ffffff;
    }

    /* ==========================================
       2. SPLIT VIEW LAYOUT (DESKTOP & IPAD)
       ========================================== */
    .split-view-container {
      display: flex;
      gap: 1.5rem;
      width: 100%;
      align-items: flex-start;
      position: relative;
    }

    /* Left Panel: List (50% Width) */
    .split-view-left {
      flex: 1;
      width: 50%;
      max-height: 80vh;
      overflow-y: auto;
      padding-right: 0.25rem;
    }

    .split-view-left::-webkit-scrollbar {
      width: 6px;
    }
    .split-view-left::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }

    /* Right Panel: Sticky Details (50% Width) */
    .split-view-right {
      flex: 1;
      width: 50%;
      position: sticky;
      top: 1.5rem;
      max-height: 80vh;
      overflow-y: auto;
    }

    /* Interactive Cards */
    .item-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 1rem 1.25rem;
      margin-bottom: 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .item-card:hover {
      background: #273549;
      border-color: #6366f1;
      transform: translateY(-1px);
    }

    .item-card.active {
      border-color: #8b5cf6;
      background: #2e2654;
    }

    .card-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .rank {
      font-weight: 700;
      color: #a78bfa;
      min-width: 32px;
    }

    .item-name {
      font-weight: 600;
      font-size: 1.05rem;
    }

    .item-subtext {
      font-size: 0.8rem;
      color: #64748b;
      margin-top: 0.1rem;
    }

    .item-pts {
      font-size: 0.9rem;
      font-weight: 600;
      color: #38bdf8;
    }

    /* Detail View Box */
    .detail-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .detail-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid #334155;
    }

    .detail-title {
      font-size: 1.5rem;
      color: #f8fafc;
    }

    .close-btn {
      display: none; /* Mobile slide-over only */
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 1.8rem;
      cursor: pointer;
      line-height: 1;
    }

    .stat-row {
      display: flex;
      gap: 1.5rem;
      margin-bottom: 1.25rem;
      background: #0f1117;
      padding: 0.85rem 1rem;
      border-radius: 8px;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
    }

    .stat-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: #64748b;
      letter-spacing: 0.5px;
    }

    .stat-value {
      font-size: 1.1rem;
      font-weight: 600;
      color: #38bdf8;
    }

    .section-title {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .detail-list {
      list-style: none;
    }

    .detail-list li {
      padding: 0.6rem 0.8rem;
      background: #0f1117;
      border-radius: 6px;
      margin-bottom: 0.4rem;
      font-size: 0.95rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Dynamic Badges */
    .badge {
      font-size: 0.75rem;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-weight: 600;
    }
    .badge-top10 { background: #581c87; color: #e9d5ff; }
    .badge-victor { background: #064e3b; color: #a7f3d0; }

    /* Empty Placeholder State */
    .detail-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 300px;
      border: 2px dashed #334155;
      border-radius: 12px;
      color: #64748b;
      text-align: center;
      padding: 1.5rem;
    }

    /* Mobile Overlay Backdrop */
    .drawer-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(2px);
      z-index: 99;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    /* ==========================================
       3. RESPONSIVE / MOBILE SLIDE-OVER DRAWER
       ========================================== */
    @media (max-width: 768px) {
      body {
        padding: 1rem;
      }

      header {
        flex-direction: column;
        gap: 0.75rem;
        align-items: flex-start;
      }

      /* Full width on mobile */
      .split-view-left {
        width: 100%;
        max-height: none;
      }

      /* Transform right panel into Slide-Over Drawer */
      .split-view-right {
        position: fixed;
        top: 0;
        right: 0;
        width: 85%;
        max-width: 400px;
        height: 100vh;
        max-height: 100vh;
        background: #1e293b;
        z-index: 100;
        transform: translateX(100%);
        transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        box-shadow: -5px 0 25px rgba(0, 0, 0, 0.5);
        border-left: 1px solid #334155;
        padding: 0;
      }

      .split-view-right.open {
        transform: translateX(0);
      }

      .drawer-overlay.open {
        display: block;
        opacity: 1;
      }

      .detail-card {
        border: none;
        border-radius: 0;
        height: 100%;
        box-shadow: none;
        overflow-y: auto;
      }

      .close-btn {
        display: block;
      }

      .detail-placeholder {
        display: none;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="logo">cudGD</div>
      <div class="nav-tabs">
        <button class="tab-btn active" id="tab-leaderboard" onclick="switchTab('leaderboard')">Leaderboard</button>
        <button class="tab-btn" id="tab-levels" onclick="switchTab('levels')">Levels</button>
      </div>
    </header>

    <!-- Backdrop for Mobile Slide-Over -->
    <div class="drawer-overlay" id="drawer-overlay" onclick="closeDetail()"></div>

    <div class="split-view-container">
      <!-- LEFT HALF (50%): List (Players or Levels) -->
      <div class="split-view-left" id="list-container">
        <!-- Dynamic list rendering -->
      </div>

      <!-- RIGHT HALF (50%): Sticky Panel (Desktop/iPad) / Slide-Over (Mobile) -->
      <div class="split-view-right" id="detail-panel">
        <div class="detail-placeholder">
          <p id="placeholder-text">Select an item from the list to view detailed information.</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    /* ==========================================
       4. DATA STRUCTURE
       ========================================== */
    const players = [
      {
        id: "putter",
        name: "Putter",
        rank: 1,
        points: 1250,
        demons: [
          { name: "Sonic Wave Unlimited", pts: "85.4 pts" },
          { name: "Acu", pts: "42.0 pts" },
          { name: "BROWNOIX", pts: "38.5 pts" },
          { name: "Color Beam", pts: "35.0 pts" },
          { name: "Erosion", pts: "31.2 pts" },
          { name: "Dismal Duststorm", pts: "29.8 pts" },
          { name: "Leyak", pts: "25.0 pts" },
          { name: "FFFFFF", pts: "22.1 pts" },
          { name: "Windy Landscape", pts: "18.5 pts" },
          { name: "Poltergeist", pts: "16.0 pts" },
          { name: "Magma Bound", pts: "14.2 pts" },
          { name: "Stalemate", pts: "12.0 pts" }
        ]
      },
      {
        id: "noon",
        name: "Noon",
        rank: 2,
        points: 1100,
        demons: [
          { name: "Acu", pts: "42.0 pts" },
          { name: "Leyak", pts: "25.0 pts" },
          { name: "Windy Landscape", pts: "18.5 pts" },
          { name: "Magma Bound", pts: "14.2 pts" }
        ]
      },
      {
        id: "max",
        name: "Max",
        rank: 3,
        points: 950,
        demons: [
          { name: "FFFFFF", pts: "22.1 pts" },
          { name: "Poltergeist", pts: "16.0 pts" },
          { name: "Stalemate", pts: "12.0 pts" }
        ]
      }
    ];

    const levels = [
      {
        id: "swu",
        name: "Sonic Wave Unlimited",
        rank: 1,
        creator: "APTeam & more",
        points: 85.4,
        victors: ["Putter"]
      },
      {
        id: "acu",
        name: "Acu",
        rank: 2,
        creator: "neigfeu",
        points: 42.0,
        victors: ["Putter", "Noon"]
      },
      {
        id: "brownoix",
        name: "BROWNOIX",
        rank: 3,
        creator: "GabeLucario",
        points: 38.5,
        victors: ["Putter"]
      },
      {
        id: "colorbeam",
        name: "Color Beam",
        rank: 4,
        creator: "KrmaL",
        points: 35.0,
        victors: ["Putter"]
      },
      {
        id: "leyak",
        name: "Leyak",
        rank: 5,
        creator: "Enzore",
        points: 25.0,
        victors: ["Putter", "Noon"]
      }
    ];

    /* ==========================================
       5. VIEW STATE & LOGIC
       ========================================== */
    let currentTab = "leaderboard";
    let selectedItemId = null;

    // Switch between Leaderboard and Levels tab
    function switchTab(tab) {
      currentTab = tab;
      selectedItemId = null;

      // Update Tab UI
      document.getElementById("tab-leaderboard").classList.toggle("active", tab === "leaderboard");
      document.getElementById("tab-levels").classList.toggle("active", tab === "levels");

      // Reset detail panel to default placeholder
      resetDetailPanel();

      // Render updated list
      renderList();
    }

    // Render left panel list
    function renderList() {
      const container = document.getElementById("list-container");

      if (currentTab === "leaderboard") {
        container.innerHTML = players.map(p => `
          <div 
            class="item-card ${selectedItemId === p.id ? 'active' : ''}" 
            onclick="selectItem('${p.id}')"
          >
            <div class="card-left">
              <span class="rank">#${p.rank}</span>
              <div>
                <div class="item-name">${p.name}</div>
                <div class="item-subtext">${p.demons.length} Demons</div>
              </div>
            </div>
            <span class="item-pts">${p.points} pts</span>
          </div>
        `).join("");
      } else {
        container.innerHTML = levels.map(l => `
          <div 
            class="item-card ${selectedItemId === l.id ? 'active' : ''}" 
            onclick="selectItem('${l.id}')"
          >
            <div class="card-left">
              <span class="rank">#${l.rank}</span>
              <div>
                <div class="item-name">${l.name}</div>
                <div class="item-subtext">by ${l.creator}</div>
              </div>
            </div>
            <span class="item-pts">${l.points} pts</span>
          </div>
        `).join("");
      }
    }

    // Select Player or Level
    function selectItem(id) {
      selectedItemId = id;
      renderList();

      const detailPanel = document.getElementById("detail-panel");
      const overlay = document.getElementById("drawer-overlay");

      if (currentTab === "leaderboard") {
        const player = players.find(p => p.id === id);
        detailPanel.innerHTML = `
          <div class="detail-card">
            <div class="detail-header">
              <h2 class="detail-title">${player.name}</h2>
              <button class="close-btn" onclick="closeDetail()">&times;</button>
            </div>

            <div class="stat-row">
              <div class="stat-item">
                <span class="stat-label">Global Rank</span>
                <span class="stat-value">#${player.rank}</span>
              </div>
              <div class="stat-item">
                <span class="stat-label">Total Points</span>
                <span class="stat-value">${player.points} pts</span>
              </div>
              <div class="stat-item">
                <span class="stat-label">Demons Beat</span>
                <span class="stat-value">${player.demons.length}</span>
              </div>
            </div>

            <p class="section-title">Completed Demons</p>
            <ul class="detail-list">
              ${player.demons.map(d => `
                <li>
                  <span>${d.name}</span>
                  <span style="color: #a78bfa; font-weight: 600;">${d.pts}</span>
                </li>
              `).join("")}
            </ul>
          </div>
        `;
      } else {
        const level = levels.find(l => l.id === id);
        detailPanel.innerHTML = `
          <div class="detail-card">
            <div class="detail-header">
              <h2 class="detail-title">${level.name}</h2>
              <button class="close-btn" onclick="closeDetail()">&times;</button>
            </div>

            <div class="stat-row">
              <div class="stat-item">
                <span class="stat-label">List Rank</span>
                <span class="stat-value">#${level.rank}</span>
              </div>
              <div class="stat-item">
                <span class="stat-label">Point Yield</span>
                <span class="stat-value">${level.points} pts</span>
              </div>
            </div>

            <p class="section-title">Level Information</p>
            <ul class="detail-list" style="margin-bottom: 1rem;">
              <li>
                <span>Creator</span>
                <span style="color: #38bdf8; font-weight: 500;">${level.creator}</span>
              </li>
            </ul>

            <p class="section-title">Verified Victors (${level.victors.length})</p>
            <ul class="detail-list">
              ${level.victors.map(v => `
                <li>
                  <span>${v}</span>
                  <span class="badge badge-victor">100%</span>
                </li>
              `).join("")}
            </ul>
          </div>
        `;
      }

      // Open mobile slide-over drawer
      detailPanel.classList.add("open");
      overlay.classList.add("open");
    }

    // Reset panel to placeholder state
    function resetDetailPanel() {
      const detailPanel = document.getElementById("detail-panel");
      const text = currentTab === "leaderboard" 
        ? "Select a player from the list to view their completed demons."
        : "Select a level to view creator details and verified victors.";

      detailPanel.innerHTML = `
        <div class="detail-placeholder">
          <p>${text}</p>
        </div>
      `;
    }

    // Close mobile slide-over
    function closeDetail() {
      const detailPanel = document.getElementById("detail-panel");
      const overlay = document.getElementById("drawer-overlay");

      detailPanel.classList.remove("open");
      overlay.classList.remove("open");

      selectedItemId = null;
      renderList();
    }

    // Boot initial view
    renderList();
  </script>
</body>
</html>
