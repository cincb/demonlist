<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Demon List</title>
</head>
<body>

    <h1>Demon List</h1>
    
    <table border="1" id="demon-table">
        <thead>
            <tr>
                <th>#</th>
                <th>Name</th>
                <th>Publisher</th>
                <th>Points</th>
            </tr>
        </thead>
        <tbody id="demon-tbody">
            <!-- JavaScript will inject rows here -->
        </tbody>
    </table>

    <!-- Import Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Wrap everything to ensure it runs safely
        (async function() {
            try {
                const SUPABASE_URL = 'https://sugqnerwwrsjkjtjokli.supabase.co';
                const SUPABASE_ANON_KEY = 'sb_publishable_ZNIVVo-1KbXyAMDDfCSY_w_XMfcxyuW';
                
                if (!window.supabase) {
                    document.body.innerHTML += `<p style="color: red;">Error: Supabase library failed to load!</p>`;
                    return;
                }

                const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

                const { data: demons, error } = await supabase
                    .from('demons')
                    .select('*')
                    .order('points', { ascending: false });

                if (error) {
                    document.body.innerHTML += `<p style="color: red;">Supabase Error: ${error.message}</p>`;
                    return;
                }

                document.body.innerHTML += `<p style="color: blue;">Debug: Fetched ${demons ? demons.length : 0} rows.</p>`;

                if (!demons || demons.length === 0) return;

                const tbody = document.getElementById('demon-tbody');
                tbody.innerHTML = '';

                demons.forEach((demon, index) => {
                    const rank = index + 1;
                    const row = tbody.insertRow();
                    row.innerHTML = `
                        <td>#${rank}</td>
                        <td>${demon.name ?? ''}</td>
                        <td>${demon.publisher ?? ''}</td>
                        <td>${demon.points ?? ''}</td>
                    `;
                });
            } catch (err) {
                document.body.innerHTML += `<p style="color: red;">Script Error: ${err.message}</p>`;
            }
        })();
    </script>
</body>
</html>
