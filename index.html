<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Demon List</title>
</head>
<body>

    <h1>Demon List</h1>
    
    <table border="1" id="demon-table">
        <thead>
            <tr>
                <th>#</th>
                <th>Name</th>
                <th>Publisher</th>
                <th>Points</th>
            </tr>
        </thead>
        <tbody id="demon-tbody">
            <!-- JavaScript will inject rows here -->
        </tbody>
    </table>

    <!-- Import Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Replace these with your actual Supabase project credentials
        const SUPABASE_URL = 'https://sugqnerwwrsjkjtjokli.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_ZNIVVo-1KbXyAMDDfCSY_w_XMfcxyuW';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function fetchDemons() {
            const { data: demons, error } = await supabase
                .from('demons')
                .select('*')
                .order('order_index', { ascending: true });

            if (error) {
                document.body.innerHTML += `<p style="color: red;">Error: ${error.message}</p>`;
                return;
            }

            // This will literally print how many items came back from Supabase onto your screen
            document.body.innerHTML += `<p style="color: cyan;">Debug: Fetched ${demons ? demons.length : 'null'} rows from Supabase.</p>`;

            if (!demons || demons.length === 0) return;

            const tbody = document.getElementById('demon-tbody');
            tbody.innerHTML = '';

            demons.forEach((demon, index) => {
                const rank = index + 1;
                const row = tbody.insertRow();
                row.innerHTML = `
                    <td>#${rank}</td>
                    <td>${demon.name ?? ''}</td>
                    <td>${demon.publisher ?? ''}</td>
                    <td>${demon.points ?? ''}</td>
                `;
            });
        }

        fetchDemons();
    </script>
</body>
</html>
