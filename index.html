<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cudGD Demonlist</title>
  <!-- Tailwind CSS for dark GD aesthetics -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen pb-12">

  <!-- Header Section -->
  <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-10">
    <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-black text-indigo-400 tracking-wider uppercase">cudGD <span class="text-slate-400 font-normal text-sm">Demonlist</span></h1>
      
      <!-- Navigation Tabs -->
      <nav class="flex gap-2">
        <button id="btn-levels" onclick="switchTab('levels')" class="px-4 py-2 bg-indigo-600 text-white rounded-lg font-semibold text-sm transition shadow-lg shadow-indigo-500/20">Demons</button>
        <button id="btn-leaderboard" onclick="switchTab('leaderboard')" class="px-4 py-2 bg-slate-800 text-slate-300 rounded-lg font-semibold text-sm hover:bg-slate-700 transition">Leaderboard</button>
      </nav>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 mt-8">

    <!-- LEVELS VIEW -->
    <section id="view-levels" class="space-y-4">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-xl font-bold text-slate-200">Main List</h2>
        <span id="level-count" class="text-xs text-slate-400 font-mono">0 Levels</span>
      </div>
      
      <!-- Level Cards Container -->
      <div id="levels-container" class="space-y-3"></div>
    </section>

    <!-- LEADERBOARD VIEW -->
    <section id="view-leaderboard" class="hidden space-y-4">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-xl font-bold text-slate-200">Player Leaderboard</h2>
        <span class="text-xs text-slate-400">Ranked by List Points</span>
      </div>

      <!-- Leaderboard Table Container -->
      <div id="leaderboard-container" class="space-y-3"></div>
    </section>

  </main>

  <!-- PLAYER PROFILE MODAL -->
  <div id="player-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-lg p-6 space-y-6 shadow-2xl relative">
      <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-xl">✕</button>
      
      <!-- Profile Header -->
      <div class="border-b border-slate-800 pb-4">
        <h3 id="modal-username" class="text-2xl font-black text-indigo-400">Player</h3>
        <p id="modal-stats" class="text-sm text-slate-400 mt-1">Rank #1 • 0.00 Points</p>
      </div>

      <!-- Hardest Demon -->
      <div>
        <span class="text-xs text-slate-500 uppercase font-bold tracking-wider">Hardest Demon</span>
        <p id="modal-hardest" class="text-lg font-bold text-slate-200 mt-1">None</p>
      </div>

      <!-- Beaten Levels List -->
      <div>
        <span class="text-xs text-slate-500 uppercase font-bold tracking-wider">Completed Demons</span>
        <div id="modal-completions" class="mt-2 space-y-2 max-h-48 overflow-y-auto pr-2"></div>
      </div>
    </div>
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    // 1. MOCK DATA (Simulates database records)
    const players = [
      { id: 1, username: "Putter" },
      { id: 2, username: "Noon" },
      { id: 3, username: "Max" }
    ];

    const levels = [
      { id: 1, name: "Necropolis", creator: "Darnoc", placement: 8, tier: "Classic Tier 4" },
      { id: 2, name: "Just DANCE", creator: "Ggb0y", placement: 20, tier: "Classic Tier 3" },
      { id: 3, name: "ILOVECYAN", creator: "KrmaL", placement: 21, tier: "Classic Tier 3" }
    ];

    // Completions link player_id to level_id
    const completions = [
      { player_id: 1, level_id: 1 }, // Putter beat Necropolis
      { player_id: 1, level_id: 2 }, // Putter beat Just DANCE
      { player_id: 2, level_id: 2 }, // Noon beat Just DANCE
      { player_id: 3, level_id: 3 }  // Max beat ILOVECYAN
    ];

    // Point Calculation Formula
    function getPoints(placement) {
      if (placement > 100) return 0;
      return +(100 * Math.pow((101 - placement) / 100, 1.5)).toFixed(2);
    }

    // Render Levels
    function renderLevels() {
      const container = document.getElementById('levels-container');
      container.innerHTML = '';
      document.getElementById('level-count').textContent = `${levels.length} Levels`;

      // Sort levels by placement (#1 down)
      const sortedLevels = [...levels].sort((a, b) => a.placement - b.placement);

      sortedLevels.forEach(level => {
        const points = getPoints(level.placement);
        const conquerors = completions
          .filter(c => c.level_id === level.id)
          .map(c => players.find(p => p.id === c.player_id)?.username)
          .filter(Boolean);

        const card = document.createElement('div');
        card.className = "bg-slate-900 border border-slate-800/80 rounded-xl p-4 flex flex-col sm:flex-row justify-between sm:items-center gap-3 hover:border-slate-700 transition";
        card.innerHTML = `
          <div class="flex items-center gap-3">
            <span class="text-lg font-black text-indigo-400 font-mono">#${level.placement}</span>
            <div>
              <div class="flex items-center gap-2">
                <h3 class="font-bold text-lg text-slate-100">${level.name}</h3>
                <span class="text-xs bg-slate-800 text-indigo-300 px-2 py-0.5 rounded font-medium">${level.tier}</span>
              </div>
              <p class="text-xs text-slate-400">by ${level.creator}</p>
            </div>
          </div>
          <div class="flex items-center justify-between sm:justify-end gap-4 text-right border-t border-slate-800/50 sm:border-0 pt-2 sm:pt-0">
            <div>
              <span class="text-xs text-slate-400 block font-mono">${points} pts</span>
              <span class="text-xs text-indigo-400 font-medium">${conquerors.length} Victor(s)</span>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Render Leaderboard
    function renderLeaderboard() {
      const container = document.getElementById('leaderboard-container');
      container.innerHTML = '';

      // Calculate total points for each player
      const leaderboardData = players.map(player => {
        const playerCompletions = completions.filter(c => c.player_id === player.id);
        const playerLevels = playerCompletions
          .map(c => levels.find(l => l.id === c.level_id))
          .filter(Boolean)
          .sort((a, b) => a.placement - b.placement); // Hardest level first

        const totalPoints = playerLevels.reduce((sum, l) => sum + getPoints(l.placement), 0);
        const hardestDemon = playerLevels.length > 0 ? playerLevels[0].name : "None";

        return {
          ...player,
          totalPoints: +totalPoints.toFixed(2),
          demonsBeaten: playerLevels.length,
          hardestDemon,
          completedLevels: playerLevels
        };
      }).sort((a, b) => b.totalPoints - a.totalPoints);

      leaderboardData.forEach((player, index) => {
        const rank = index + 1;
        const card = document.createElement('div');
        card.className = "bg-slate-900 border border-slate-800 rounded-xl p-4 flex justify-between items-center hover:border-indigo-500/50 cursor-pointer transition";
        card.onclick = () => openPlayerModal(player, rank);
        
        card.innerHTML = `
          <div class="flex items-center gap-4">
            <span class="font-black text-lg ${rank === 1 ? 'text-amber-400' : rank === 2 ? 'text-slate-300' : rank === 3 ? 'text-amber-600' : 'text-slate-500'}">#${rank}</span>
            <div>
              <h4 class="font-bold text-slate-100">${player.username}</h4>
              <p class="text-xs text-slate-400">${player.demonsBeaten} Demons Beaten</p>
            </div>
          </div>
          <div class="text-right">
            <span class="font-mono font-bold text-indigo-400 text-lg">${player.totalPoints}</span>
            <span class="text-xs text-slate-500 block">PTS</span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Navigation Switcher
    function switchTab(tab) {
      const levelsView = document.getElementById('view-levels');
      const leaderboardView = document.getElementById('view-leaderboard');
      const btnLevels = document.getElementById('btn-levels');
      const btnLeaderboard = document.getElementById('btn-leaderboard');

      if (tab === 'levels') {
        levelsView.classList.remove('hidden');
        leaderboardView.classList.add('hidden');
        btnLevels.className = "px-4 py-2 bg-indigo-600 text-white rounded-lg font-semibold text-sm transition shadow-lg shadow-indigo-500/20";
        btnLeaderboard.className = "px-4 py-2 bg-slate-800 text-slate-300 rounded-lg font-semibold text-sm hover:bg-slate-700 transition";
      } else {
        levelsView.classList.add('hidden');
        leaderboardView.classList.remove('hidden');
        btnLeaderboard.className = "px-4 py-2 bg-indigo-600 text-white rounded-lg font-semibold text-sm transition shadow-lg shadow-indigo-500/20";
        btnLevels.className = "px-4 py-2 bg-slate-800 text-slate-300 rounded-lg font-semibold text-sm hover:bg-slate-700 transition";
      }
    }

    // Modal Control
    function openPlayerModal(player, rank) {
      document.getElementById('modal-username').textContent = player.username;
      document.getElementById('modal-stats').textContent = `Rank #${rank} • ${player.totalPoints} Points`;
      document.getElementById('modal-hardest').textContent = player.hardestDemon;

      const listContainer = document.getElementById('modal-completions');
      listContainer.innerHTML = '';

      if (player.completedLevels.length === 0) {
        listContainer.innerHTML = `<p class="text-xs text-slate-500 italic">No beaten demons recorded yet.</p>`;
      } else {
        player.completedLevels.forEach(lvl => {
          const item = document.createElement('div');
          item.className = "bg-slate-950 p-2.5 rounded-lg flex justify-between items-center text-xs";
          item.innerHTML = `
            <span class="font-bold text-slate-200">#${lvl.placement} - ${lvl.name}</span>
            <span class="text-slate-400 font-mono">${getPoints(lvl.placement)} pts</span>
          `;
          listContainer.appendChild(item);
        });
      }

      document.getElementById('player-modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('player-modal').classList.add('hidden');
    }

    // Initial Load
    renderLevels();
    renderLeaderboard();
  </script>
</body>
</html>
