<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cudGD Demonlist</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              500: '#f97316', // Orange primary
              600: '#ea580c', // Darker orange hover
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen pb-12">

  <!-- Header Section -->
  <header class="border-b border-slate-800 bg-slate-950">
    <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-xl font-bold text-slate-100">cudGD <span class="text-orange-500 font-normal text-sm">Demonlist</span></h1>
      
      <!-- Navigation Buttons & Admin Toggle -->
      <div class="flex items-center gap-3">
        <nav class="flex gap-2">
          <button id="btn-levels" onclick="switchMainTab('levels')" class="px-4 py-1.5 bg-orange-600 text-white rounded font-medium text-sm">Demons</button>
          <button id="btn-leaderboard" onclick="switchMainTab('leaderboard')" class="px-4 py-1.5 bg-slate-800 text-slate-300 rounded font-medium text-sm hover:bg-slate-700">Leaderboard</button>
        </nav>
        <button onclick="toggleAdminPanel()" class="px-3 py-1.5 bg-slate-800 text-orange-400 border border-orange-500/30 rounded font-medium text-xs hover:bg-slate-700">⚙️ Admin</button>
      </div>
    </div>
  </header>

  <!-- ADMIN EDIT BAR (Hidden by default) -->
  <div id="admin-bar" class="bg-orange-950/40 border-b border-orange-500/30 py-3 px-4 hidden">
    <div class="max-w-4xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-3">
      <div class="flex items-center gap-2">
        <span class="text-xs font-bold uppercase text-orange-400 tracking-wider">Admin Mode Active:</span>
        <span class="text-xs text-slate-300">Tap checkboxes on level cards to instantly toggle completions.</span>
      </div>
      <button onclick="toggleAdminPanel()" class="text-xs text-orange-400 hover:text-white underline">Exit Admin Mode</button>
    </div>
  </div>

  <main class="max-w-4xl mx-auto px-4 mt-6">

    <!-- LEVELS VIEW -->
    <section id="view-levels" class="space-y-4">
      
      <!-- Tier Filter Tabs -->
      <div class="flex items-center gap-2 overflow-x-auto pb-2 border-b border-slate-800">
        <span class="text-xs text-slate-400 font-bold uppercase tracking-wider mr-2">Tiers:</span>
        <button id="tier-btn-1" onclick="selectTier(1)" class="px-3 py-1 bg-slate-800 text-slate-300 rounded text-xs font-semibold hover:bg-slate-700">Tier 1</button>
        <button id="tier-btn-2" onclick="selectTier(2)" class="px-3 py-1 bg-slate-800 text-slate-300 rounded text-xs font-semibold hover:bg-slate-700">Tier 2</button>
        <button id="tier-btn-3" onclick="selectTier(3)" class="px-3 py-1 bg-slate-800 text-slate-300 rounded text-xs font-semibold hover:bg-slate-700">Tier 3</button>
        <button id="tier-btn-4" onclick="selectTier(4)" class="px-3 py-1 bg-orange-600 text-white rounded text-xs font-semibold">Tier 4</button>
      </div>

      <div class="flex justify-between items-center">
        <h2 id="current-tier-title" class="text-lg font-bold text-slate-200">Classic Tier 4</h2>
        <span id="level-count" class="text-xs text-slate-400 font-mono">0 Levels</span>
      </div>
      
      <!-- Level Cards Container -->
      <div id="levels-container" class="space-y-2"></div>
    </section>

    <!-- LEADERBOARD VIEW -->
    <section id="view-leaderboard" class="hidden space-y-3">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-bold text-slate-200">Player Leaderboard</h2>
        <span class="text-xs text-slate-400">Ranked by List Points</span>
      </div>

      <!-- Leaderboard Table Container -->
      <div id="leaderboard-container" class="space-y-2"></div>
    </section>

  </main>

  <!-- PLAYER PROFILE MODAL -->
  <div id="player-modal" class="fixed inset-0 bg-black/60 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-700 rounded-lg w-full max-w-md p-5 space-y-4 relative">
      <button onclick="closeModal()" class="absolute top-3 right-3 text-slate-400 hover:text-white font-bold">✕</button>
      
      <!-- Profile Header -->
      <div class="border-b border-slate-800 pb-3">
        <h3 id="modal-username" class="text-xl font-bold text-orange-400">Player</h3>
        <p id="modal-stats" class="text-xs text-slate-400 mt-0.5">Rank #1 • 0.00 Points</p>
      </div>

      <!-- Hardest Demon -->
      <div>
        <span class="text-xs text-slate-400 uppercase font-bold tracking-wide">Hardest Demon</span>
        <p id="modal-hardest" class="text-base font-semibold text-slate-200 mt-0.5">None</p>
      </div>

      <!-- Beaten Levels List -->
      <div>
        <span class="text-xs text-slate-400 uppercase font-bold tracking-wide">Completed Demons</span>
        <div id="modal-completions" class="mt-2 space-y-1.5 max-h-48 overflow-y-auto pr-1"></div>
      </div>
    </div>
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    let currentTier = 4;
    let isAdminMode = false;

    // 1. DATA (In-Memory State)
    const players = [
      { id: 1, username: "Putter" },
      { id: 2, username: "Noon" },
      { id: 3, username: "Max" }
    ];

    const levels = [
      { id: 1, name: "Necropolis", creator: "Darnoc", tier: 3, placement: 8 },
      { id: 2, name: "Just DANCE", creator: "Ggb0y", tier: 4, placement: 20 },
      { id: 3, name: "ILOVECYAN", creator: "KrmaL", tier: 4, placement: 21 }
    ];

    let completions = [
      { player_id: 1, level_id: 1 },
      { player_id: 1, level_id: 2 },
      { player_id: 2, level_id: 2 },
      { player_id: 3, level_id: 3 }
    ];

    const tierPointWeights = { 1: 1, 2: 2.5, 3: 5, 4: 10 };

    function getPoints(level) {
      const weight = tierPointWeights[level.tier] || 1;
      const basePoints = 100 * Math.pow((101 - level.placement) / 100, 1.5);
      return +(basePoints * (weight / 10)).toFixed(2);
    }

    // Toggle Admin Panel
    function toggleAdminPanel() {
      isAdminMode = !isAdminMode;
      document.getElementById('admin-bar').classList.toggle('hidden', !isAdminMode);
      renderLevels();
    }

    // Toggle a completion for a player live
    function togglePlayerCompletion(playerId, levelId) {
      const existingIndex = completions.findIndex(c => c.player_id === playerId && c.level_id === levelId);
      if (existingIndex > -1) {
        completions.splice(existingIndex, 1);
      } else {
        completions.push({ player_id: playerId, level_id: levelId });
      }
      renderLevels();
      renderLeaderboard();
    }

    // Render Levels
    function renderLevels() {
      const container = document.getElementById('levels-container');
      container.innerHTML = '';
      
      const filteredLevels = levels
        .filter(l => l.tier === currentTier)
        .sort((a, b) => a.placement - b.placement);

      document.getElementById('current-tier-title').textContent = `Classic Tier ${currentTier}`;
      document.getElementById('level-count').textContent = `${filteredLevels.length} Levels`;

      if (filteredLevels.length === 0) {
        container.innerHTML = `<p class="text-xs text-slate-500 italic py-4">No levels added to Tier ${currentTier} yet.</p>`;
        return;
      }

      filteredLevels.forEach(level => {
        const points = getPoints(level);
        const conquerors = completions
          .filter(c => c.level_id === level.id)
          .map(c => players.find(p => p.id === c.player_id)?.username)
          .filter(Boolean);

        const card = document.createElement('div');
        card.className = "bg-slate-950 border border-slate-800 rounded p-3 flex flex-col gap-2";
        
        let adminHtml = '';
        if (isAdminMode) {
          adminHtml = `
            <div class="border-t border-slate-800/80 pt-2 flex items-center gap-3 text-xs text-slate-400">
              <span class="font-bold text-orange-400">Victor Check:</span>
              ${players.map(p => {
                const isBeaten = completions.some(c => c.player_id === p.id && c.level_id === level.id);
                return `
                  <label class="flex items-center gap-1 cursor-pointer hover:text-slate-200">
                    <input type="checkbox" ${isBeaten ? 'checked' : ''} onchange="togglePlayerCompletion(${p.id},${level.id})" class="accent-orange-500 rounded">
                    ${p.username}
                  </label>
                `;
              }).join('')}
            </div>
          `;
        }

        card.innerHTML = `
          <div class="flex justify-between items-center">
            <div class="flex items-center gap-3">
              <span class="text-base font-bold text-orange-400 font-mono">#${level.placement}</span>
              <div>
                <div class="flex items-center gap-2">
                  <h3 class="font-bold text-slate-100">${level.name}</h3>
                  <span class="text-xs bg-slate-800 text-orange-300 px-1.5 py-0.5 rounded">Tier ${level.tier}</span>
                </div>
                <p class="text-xs text-slate-400">by ${level.creator}</p>
              </div>
            </div>
            <div class="text-right">
              <span class="text-xs text-slate-300 font-mono block">${points} pts</span>
              <span class="text-xs text-slate-500">${conquerors.length} Victor(s)</span>
            </div>
          </div>
          ${adminHtml}
        `;
        container.appendChild(card);
      });
    }

    function selectTier(tierNumber) {
      currentTier = tierNumber;
      [1, 2, 3, 4].forEach(t => {
        const btn = document.getElementById(`tier-btn-${t}`);
        if (t === tierNumber) {
          btn.className = "px-3 py-1 bg-orange-600 text-white rounded text-xs font-semibold";
        } else {
          btn.className = "px-3 py-1 bg-slate-800 text-slate-300 rounded text-xs font-semibold hover:bg-slate-700";
        }
      });
      renderLevels();
    }

    function renderLeaderboard() {
      const container = document.getElementById('leaderboard-container');
      container.innerHTML = '';

      const leaderboardData = players.map(player => {
        const playerCompletions = completions.filter(c => c.player_id === player.id);
        const playerLevels = playerCompletions
          .map(c => levels.find(l => l.id === c.level_id))
          .filter(Boolean)
          .sort((a, b) => {
            if (b.tier !== a.tier) return b.tier - a.tier;
            return a.placement - b.placement;
          });

        const totalPoints = playerLevels.reduce((sum, l) => sum + getPoints(l), 0);
        const hardestDemon = playerLevels.length > 0 
          ? `${playerLevels[0].name} (Tier ${playerLevels[0].tier} #${playerLevels[0].placement})` 
          : "None";

        return {
          ...player,
          totalPoints: +totalPoints.toFixed(2),
          demonsBeaten: playerLevels.length,
          hardestDemon,
          completedLevels: playerLevels
        };
      }).sort((a, b) => b.totalPoints - a.totalPoints);

      leaderboardData.forEach((player, index) => {
        const rank = index + 1;
        const card = document.createElement('div');
        card.className = "bg-slate-950 border border-slate-800 rounded p-3 flex justify-between items-center cursor-pointer hover:bg-slate-800/50";
        card.onclick = () => openPlayerModal(player, rank);
        
        card.innerHTML = `
          <div class="flex items-center gap-3">
            <span class="font-bold text-sm ${rank === 1 ? 'text-amber-400' : 'text-slate-400'}">#${rank}</span>
            <div>
              <h4 class="font-bold text-slate-100">${player.username}</h4>
              <p class="text-xs text-slate-400">${player.demonsBeaten} Demons Beaten</p>
            </div>
          </div>
          <div class="text-right">
            <span class="font-mono font-bold text-orange-400">${player.totalPoints}</span>
            <span class="text-xs text-slate-500 block">PTS</span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function switchMainTab(tab) {
      const levelsView = document.getElementById('view-levels');
      const leaderboardView = document.getElementById('view-leaderboard');
      const btnLevels = document.getElementById('btn-levels');
      const btnLeaderboard = document.getElementById('btn-leaderboard');

      if (tab === 'levels') {
        levelsView.classList.remove('hidden');
        leaderboardView.classList.add('hidden');
        btnLevels.className = "px-4 py-1.5 bg-orange-600 text-white rounded font-medium text-sm";
        btnLeaderboard.className = "px-4 py-1.5 bg-slate-800 text-slate-300 rounded font-medium text-sm hover:bg-slate-700";
      } else {
        levelsView.classList.add('hidden');
        leaderboardView.classList.remove('hidden');
        btnLeaderboard.className = "px-4 py-1.5 bg-orange-600 text-white rounded font-medium text-sm";
        btnLevels.className = "px-4 py-1.5 bg-slate-800 text-slate-300 rounded font-medium text-sm hover:bg-slate-700";
      }
    }

    function openPlayerModal(player, rank) {
      document.getElementById('modal-username').textContent = player.username;
      document.getElementById('modal-stats').textContent = `Rank #${rank} • ${player.totalPoints} Points`;
      document.getElementById('modal-hardest').textContent = player.hardestDemon;

      const listContainer = document.getElementById('modal-completions');
      listContainer.innerHTML = '';

      if (player.completedLevels.length === 0) {
        listContainer.innerHTML = `<p class="text-xs text-slate-500 italic">No beaten demons recorded yet.</p>`;
      } else {
        player.completedLevels.forEach(lvl => {
          const item = document.createElement('div');
          item.className = "bg-slate-950 p-2 rounded flex justify-between items-center text-xs border border-slate-800";
          item.innerHTML = `
            <span class="font-semibold text-slate-200">Tier ${lvl.tier} #${lvl.placement} - ${lvl.name}</span>
            <span class="text-slate-400 font-mono">${getPoints(lvl)} pts</span>
          `;
          listContainer.appendChild(item);
        });
      }

      document.getElementById('player-modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('player-modal').classList.add('hidden');
    }

    renderLevels();
    renderLeaderboard();
  </script>
</body>
</html>
