<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Demon List Admin Panel</title>
</head>
<body>

    <h1>Demon List Admin Panel</h1>

    <!-- LOGIN SECTION (Shown if not logged in) -->
    <div id="login-section">
        <h3>Admin Login</h3>
        <input type="email" id="email" placeholder="Your Email"><br><br>
        <input type="password" id="password" placeholder="Password"><br><br>
        <button onclick="login()">Log In</button>
        <p id="login-error" style="color: red;"></p>
    </div>

    <!-- ADMIN DASHBOARD (Hidden until you log in) -->
    <div id="admin-section" style="display: none;">
        <p>Logged in successfully! <button onclick="logout()">Log Out</button></p>
        
        <hr>

        <h3>Add New Level</h3>
        <form id="add-form" onsubmit="addDemon(event)">
            <input type="text" id="name" placeholder="Level Name" required><br><br>
            <input type="text" id="publisher" placeholder="Publisher / Verifier" required><br><br>
            <input type="number" id="points" placeholder="Points" required><br><br>
            <input type="number" step="0.1" id="order_index" placeholder="Order Index (e.g. 1.0, 2.5)" required><br><br>
            <button type="submit">Add Demon</button>
        </form>

        <hr>

        <h3>Manage / Delete Levels</h3>
        <table border="1" id="admin-table">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Points</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="admin-tbody"></tbody>
        </table>
    </div>

    <!-- Import Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://sugqnerwwrsjkjtjokli.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_ZNIVVo-1KbXyAMDDfCSY_w_XMfcxyuW';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Check if already logged in on page load
        async function checkUser() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                showAdminPanel();
            }
        }
        checkUser();

        // Login function
        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            
            if (error) {
                document.getElementById('login-error').innerText = error.message;
            } else {
                showAdminPanel();
            }
        }

        // Logout function
        async function logout() {
            await supabase.auth.signOut();
            document.getElementById('admin-section').style.display = 'none';
            document.getElementById('login-section').style.display = 'block';
        }

        // Switch views when logged in
        function showAdminPanel() {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('admin-section').style.display = 'block';
            loadAdminTable();
        }

        // Add a new demon
        async function addDemon(event) {
            event.preventDefault();
            const name = document.getElementById('name').value;
            const publisher = document.getElementById('publisher').value;
            const points = parseInt(document.getElementById('points').value);
            const order_index = parseFloat(document.getElementById('order_index').value);

            const { error } = await supabase
                .from('demons')
                .insert([{ name, publisher, points, order_index }]);

            if (error) {
                alert('Error adding level: ' + error.message);
            } else {
                alert('Level added successfully!');
                document.getElementById('add-form').reset();
                loadAdminTable();
            }
        }

        // Load table with Delete buttons for management
        async function loadAdminTable() {
            const { data: demons, error } = await supabase
                .from('demons')
                .select('*')
                .order('order_index', { ascending: true });

            if (error) {
                console.error('Error loading table:', error);
                return;
            }

            const tbody = document.getElementById('admin-tbody');
            tbody.innerHTML = '';

            demons.forEach(demon => {
                const row = tbody.insertRow();
                row.innerHTML = `
                    <td>${demon.name}</td>
                    <td>${demon.points}</td>
                    <td><button onclick="deleteDemon('${demon.id}')" style="background-color: red; color: white;">Delete</button></td>
                `;
            });
        }

        // Delete a level by its unique ID
        async function deleteDemon(id) {
            if (!confirm('Are you sure you want to delete this level?')) return;

            const { error } = await supabase
                .from('demons')
                .delete()
                .eq('id', id);

            if (error) {
                alert('Error deleting: ' + error.message);
            } else {
                loadAdminTable();
            }
        }
    </script>
</body>
</html>
